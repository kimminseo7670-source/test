<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>먼작귀와 함께 공부해요! ✨</title>
    <style>
        /* 기본 스타일 설정 */
        body {
            font-family: 'Pretendard', sans-serif; /* 나중에 이쁜 폰트로 바꿔도 돼요 */
            margin: 0;
            padding: 0;
            background-color: #fcebeb; /* 부드러운 분홍색 배경 */
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            background-color: #fff;
            padding: 20px;
            text-align: center;
            width: 100%;
            border-bottom: 5px solid #ffcccc; /* 더 진한 분홍색 선 */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h1 {
            color: #ff9999;
            margin: 0;
            font-size: 2em;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 800px;
            margin-top: 30px;
            gap: 20px;
        }

        /* 각 섹션 스타일 */
        .section {
            background-color: rgba(255, 255, 255, 0.9); /* 약간 투명한 흰색 배경 */
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border: 2px solid #ffcccc;
        }

        h2 {
            color: #ffcccc;
            border-bottom: 2px solid #ffcccc;
            padding-bottom: 10px;
            margin-top: 0;
        }

        /* 타이머 스타일 */
        #timer {
            text-align: center;
        }

        #timer-display {
            font-size: 3em;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
        }

        .timer-buttons
